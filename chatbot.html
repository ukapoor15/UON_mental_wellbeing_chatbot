<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UON Wellbeing Chatbot</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- jQuery (IMPORTANT) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}">

  <script defer src="{{ url_for('static', filename='chatbot.js') }}"></script>
</head>

<body class="bg-gradient-to-br from-purple-100 via-blue-100 to-pink-100 min-h-screen flex flex-col light-mode">

  <!-- Navbar -->
  <nav class="bg-white shadow-md fixed w-full top-0 left-0 z-50">
    <div class="container mx-auto flex justify-between items-center py-4 px-6">
      <a href="{{ url_for('index') }}" class="-ml-10">
        <img src="{{ url_for('static', filename='mindbotlogo.png') }}"
             alt="Mindbot Logo"
             class="h-11 w-auto object-contain">
      </a>
      <div>
        <a href="{{ url_for('index') }}" class="text-gray-700 hover:text-purple-600 px-4">Home</a>
        <a href="{{ url_for('about') }}" class="text-gray-700 hover:text-purple-600 px-4">About</a>
        <a href="{{ url_for('support') }}" class="text-gray-700 hover:text-purple-600 px-4">Support</a>
      </div>
    </div>
  </nav>

  <!-- Chatbot Container -->
  <div class="flex-1 flex items-center justify-center pt-24 pb-10 px-4">
    <div class="w-full max-w-md p-6 rounded-3xl shadow-2xl flex flex-col justify-between h-[600px] chat-container">
      <div class="chat-status-bar">
        <img src="/static/Screenshot 2025-05-22 200758.png" alt="MindBot Avatar" class="bot-avatar">
        <div class="status-text">
        <span> MindBot </span>
        <p>🟢 Online</p>
      </div>
      </div>
      
      <!-- Chat Messages -->
      <div id="chat-box" class="flex-1 overflow-y-auto space-y-4 mb-4 p-2">
        <!-- Messages will appear here -->
      </div>

      <!-- Typing Indicator (Optional, handled in JS) -->
      <!-- <div id="typing-indicator" class="text-sm text-gray-500 italic hidden">Typing...</div> -->
       

      <!-- Input + Buttons -->
      <div class="flex items-center space-x-2">
        <input type="text" id="user-input" placeholder="Type your message..." 
          class="flex-1 bg-gray-100 rounded-full px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400 dark:bg-gray-700 dark:text-white">
          <button id="voice-button">🎤</button>

        <button id="send-button" class="bg-purple-500 hover:bg-purple-400 text-white rounded-full p-3 transition-all">
          ➤
        </button>

      </div>

      <!-- Extra Control Buttons -->
      <div class="flex space-x-4">
        <button id="theme-toggle" class="flex-1 bg-white hover:bg-indigo-400 text-black rounded-full py-2 transition-all">
          🌙 Toggle Theme
        </button>
        <button id="history-toggle" class="flex-1 bg-white hover:bg-blue-400 text-black rounded-full py-2 transition-all">
          🕑 History
        </button>
        
      </div>      

    </div>
  </div>

  <!-- Footer -->
  <footer class="text-center py-6 bg-gray-800 text-white text-sm">
    © 2025 Mindbot | 
    <a href="{{ url_for('about') }}" class="hover:underline">About</a> | 
    <a href="{{ url_for('support') }}" class="hover:underline">Support</a>
  </footer>

</body>
</html>
